; Orbital Passthrough: GTA V side. Copy next to OrbitalPassthrough.asi in the GTA V folder.
; Every setting is optional; the values below are the defaults. The log is OrbitalPassthrough.log next to the .asi.

[bridge]
; Must match ipc.name in Minecraft's config/orbital-passthrough.properties.
name = OrbitalCannonPassthrough_v1

[render]
; "auto" measures the candidates below with GET_MODEL_DIMENSIONS at start-up and picks the one closest to a 1 m cube
; (see the log, lines starting with [calibrate]). Set a model name to skip that, e.g.  model = prop_mb_sandblock_01
model = auto
; Names that do not exist in your game build are skipped. Add your own.
model_candidates = prop_mb_sandblock_01, prop_mb_sandblock_02, prop_mb_sandblock_03, prop_mb_sandblock_04, prop_mb_sandblock_05, prop_conc_blocks01a, prop_conc_blocks01b, prop_conc_blocks01c, prop_box_wood01a, prop_box_wood02a, prop_box_wood04a, prop_box_wood05a, prop_box_wood05b, prop_box_wood07a, prop_box_wood08a, prop_cons_crate, prop_crate_01a, prop_crate_11e, prop_cs_cardbox_01, prop_boxpile_06b
; Hard cap on live + parked props. GTA V starts to misbehave at a few thousand script objects; keep this conservative.
max_props = 1500
; Blocks nearer than this (metres) get props, nearest first. Props retire at spawn_radius + retire_margin.
spawn_radius = 22
retire_margin = 4
max_spawns_per_frame = 48
max_retires_per_frame = 96
; Wall-clock budget for spawning per frame, microseconds.
frame_budget_us = 1500
; >0 derives a texture variation from the block's map colour (only works on models that have variations).
colour_buckets = 0

[world]
; false: press the anchor key to pin the world to where you stand. true: pin it automatically 3 s after Minecraft connects.
auto_anchor = false
; Lifts the whole Minecraft world above GTA's ground (metres) to avoid z-fighting with the terrain.
anchor_z_offset = 0.0
; How far Minecraft streams around you (blocks). Minecraft clamps these to its own limits.
view_radius_h = 28
view_radius_v = 24

[interaction]
; Crosshair mining/placing range (metres) and the damage a mining hit deals.
reach = 7
tool_damage = 60
; Damage of explosive weapons (rocket launcher etc.); Minecraft turns it into a blast radius.
explosive_damage = 400
bullet_range = 300
; Speed (m/s) a vehicle must lose in one frame, touching blocks, to count as an impact.
collision_min_delta_v = 4
vehicle_mass_kg = 1500
shots = true
collisions = true

[keys]
; Windows virtual-key codes (decimal or 0x hex).
anchor = 0x78       ; F9   pin the Minecraft world at your feet
overlay = 0x79      ; F10  toggle the status overlay
mine = 0x76         ; F7   break the block under the crosshair
place = 0x75        ; F6   place the selected block on the face under the crosshair
calibrate = 0x77    ; F8   re-measure the candidate models
prev_block = 0xDB   ; [    previous placeable block
next_block = 0xDD   ; ]    next placeable block

[ui]
overlay = true

[palette]
; Optional per-block overrides:   <registry name> = <model name>[, <texture variation>]
; minecraft:glass = prop_some_glass_like_model, 0
