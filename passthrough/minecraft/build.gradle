plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:5.12.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

base {
	archivesName = project.archives_base_name
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs << "-Xlint:deprecation"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
	// The IPC layer uses the Foreign Function & Memory API (restricted methods); allow it without warnings in tests.
	jvmArgs "--enable-native-access=ALL-UNNAMED"
	// Set by passthrough/tools/run_all.sh: the C++ compiler's layout facts, diffed against the Java mirror.
	environment "OCP_LAYOUT_DUMP", System.getenv("OCP_LAYOUT_DUMP") ?: ""
	testLogging {
		events "passed", "failed", "skipped"
		showStandardStreams = true
		exceptionFormat = "full"
	}
}
